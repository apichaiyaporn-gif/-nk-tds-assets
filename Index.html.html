<!DOCTYPE html>
<html lang='th'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Iframe Example</title>
</head>
<body>
  <!-- ตัวอย่างการวางใน Header -->
  <div style='width: 100px; height: 100px;'>
    <iframe 
      src='https://your-github-username.github.io/nk-tds-assets/' 
      style='width: 100%; height: 100%; border: none; pointer-events: none;'
      scrolling='no'>
    </iframe>
  </div>

  <h2>ทำไมวิธีนี้ถึงดีที่สุด?</h2>
  <ul>
    <li><strong>ใช้ได้ทุกที่:</strong> ไม่ต้องกังวลเรื่องการตั้งค่าไลบรารี 3D ในโปรเจกต์หลัก</li>
    <li><strong>พื้นหลังโปร่งใส:</strong> โลโก้จะลอยทับพื้นหลังสีม่วงเข้มของแอปคุณได้อย่างแนบเนียน</li>
    <li><strong>แก้ไขครั้งเดียวเปลี่ยนทุกที่:</strong> หากคุณอัปเดตโค้ดบน GitHub ทุกส่วนที่ใช้ URL นี้จะเปลี่ยนตามโดยอัตโนมัติครับ!</li>
  </ul>
</body>
</html>
